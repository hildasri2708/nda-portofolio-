<!DOCTYPE html>
<html>
<head>
    <title>Create Account</title>

    <style>
        body {
            background-color: #d9a8bb;
            font-family: Arial;
        }

        table {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
        }

        h1 {
            color: #666;
            background-color: #fcecf2;
            padding: 15px;
        }

        td {
            padding: 10px;
        }

        label {
            color: #d45b91;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        select,
        textarea {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input[type="submit"] {
            background-color: #d45b91;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-size: 16px;
        }

        input[type="submit"]:hover {
            background-color: #bd3f79;
        }
    </style>
</head>

<body>

    <form>
        <table align="center" width="700" cellpadding="10">

            <tr>
                <td colspan="2" align="center">
                    <h1>Create Account</h1>
                </td>
            </tr>

            <tr>
                <td>
                    <label>First name *</label><br>
                    <input type="text" size="21" placeholder="enter your first name" required>
                </td>

                <td>
                    <label>Last name</label><br>
                    <input type="text" size="21" placeholder="enter your last name">
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <label>Email *</label><br>
                    <input type="email" size="65" placeholder="enter your email" required>
                </td>
            </tr>

            <tr>
                <td>
                    <label>Password *</label><br>
                    <input type="password" size="21" placeholder="enter your password" required>
                </td>

                <td>
                    <label>Confirm Password *</label><br>
                    <input type="password" size="21" placeholder="enter your password again" required>
                </td>
            </tr>

            <tr>
                <td>
                    <label>Gender:</label><br>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                </td>

                <td>
                    <label>Hobbies</label><br>
                    <input type="checkbox">Music
                    <input type="checkbox">Sports
                    <input type="checkbox">Travel
                    <input type="checkbox">Movies
                </td>
            </tr>

            <tr>
                <td>
                    <label>Source of Income</label><br>
                    <select>
                        <option>Employed</option>
                        <option>Business</option>
                        <option>Student</option>
                        <option>Other</option>
                    </select>
                </td>

                <td>
                    <label>Income</label><br>
                    <input type="range" min="0" max="20000" value="20000"
                    oninput="document.getElementById('income').innerHTML =
                    (this.value / 1000) + 'K'">
                    <span id="income" style="background-color:#d45b91;color:white;padding:7px;border-radius:5px;">20K</span>
                </td>
            </tr>

            <tr>
                <td>
                    <label>Upload Profile Picture</label><br>
                    <input type="file">
                </td>

                <td>
                    <label>Age</label><br>
                    <input type="number" value="18" min="1" max="100" size="30">
                </td>
            </tr>

            <tr>
                <td colspan="2">
                    <label>Bio</label><br>
                    <textarea rows="5" cols="75"></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="right" bgcolor="#fcecf2">
                    <input type="submit" value="Create">
                </td>
            </tr>

        </table>
    </form>

</body>
</html>
