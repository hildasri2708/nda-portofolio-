<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline, Internal, External CSS</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        p {
            background-color: rgb(20, 188, 255);
            padding: 15px;
            border: 2px solid rgb(12, 166, 255);
        }

        .belajar {
            color: rgb(7, 7, 37);
            font-size: 25px;
        }
    </style>
</head>

<body>

    <p>
        <!-- Inline CSS -->
        <span style="color: red;">Nama saya</span>

        <strong>
            <em style="font-family: 'Courier New';">nda</em>
        </strong>

        saya sangat sangat &#128293;

        <del>tidak &#128078;</del>

        semangat sekolah dan

        <strong class="belajar">
            <u>BELAJAR</u>
        </strong>

        &#128536;
    </p>

</body>
</html>
